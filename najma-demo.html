<!doctype html>
<html lang="fr" dir="ltr" data-theme="auto" data-font="m">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Najma — نجمة : application de révision scolaire bilingue (Français / العربية) pour la Mauritanie. Du 1AF au Baccalauréat : fiches, quiz, flashcards, examens blancs, planificateur. Hors ligne.">
  <meta name="theme-color" content="#0D3B66">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/img/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Najma">
  <title>Najma · نجمة — Révisions scolaires Mauritanie</title>
  
  
<style>
/* ===== assets/css/base.css ===== */
/* ============================================================
   Najma · نجمة — Design tokens + base (reset, typographie, RTL)
   Couleurs : ocres du désert, bleu de l'Atlantique, or, blanc.
   ============================================================ */
:root{
  --brand:#0D3B66; --brand-ink:#FFFFFF; --brand-deep:#092A4A;
  --gold:#F0C75E; --gold-deep:#D9A032; --gold-ink:#3D2E04;
  --ocre:#C77B3F; --ocre-deep:#A95E28; --sand:#F2E8D5;
  --bg:#F7F3EA; --surface:#FFFFFF; --surface2:#F2EDE2;
  --ink:#1C2B36; --ink2:#52616D; --line:#E3DCCB;
  --ok:#2E7D5B; --ok-bg:#E4F2EA; --err:#B3372B; --err-bg:#FBEAE7;
  --warn:#8A5A0B; --warn-bg:#FDF3E0;
  --focus:#E0A62E;
  --r:14px; --r-sm:9px; --btn-min:48px; --pad:14px;
  --shadow:0 1px 3px rgba(9,42,74,.14), 0 4px 14px rgba(9,42,74,.08);
  --font-fr:"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-ar:"Noto Naskh Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;
  --font:var(--font-fr);
  --fs:1rem;
}
:root[data-theme="dark"]{
  --bg:#0D1B26; --surface:#142636; --surface2:#1B3145;
  --ink:#F2E8D5; --ink2:#A9BAC7; --line:#27415A;
  --brand:#3E86C2; --brand-ink:#072033; --brand-deep:#0D3B66;
  --ok:#5FBF8F; --ok-bg:#143726; --err:#E98074; --err-bg:#3A1815;
  --warn:#E9B868; --warn-bg:#33240C;
  --shadow:0 1px 3px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#0D1B26; --surface:#142636; --surface2:#1B3145;
    --ink:#F2E8D5; --ink2:#A9BAC7; --line:#27415A;
    --brand:#3E86C2; --brand-ink:#072033; --brand-deep:#0D3B66;
    --ok:#5FBF8F; --ok-bg:#143726; --err:#E98074; --err-bg:#3A1815;
    --warn:#E9B868; --warn-bg:#33240C;
    --shadow:0 1px 3px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.28);
  }
}
:root[data-font="s"]{ --fs:.9rem; }
:root[data-font="l"]{ --fs:1.12rem; }
html{ font-size:var(--fs); -webkit-text-size-adjust:100%; }
[lang="ar"], [dir="rtl"]{ font-family:var(--font-ar); line-height:1.85; }
[lang="fr"], [dir="ltr"]{ font-family:var(--font-fr); line-height:1.55; }
bdi{ unicode-bidi:isolate; }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-size:1rem; min-height:100dvh; }
h1,h2,h3,h4{ margin:.2em 0 .4em; line-height:1.3; font-weight:700; }
h1{ font-size:1.45rem; } h2{ font-size:1.2rem; } h3{ font-size:1.05rem; }
p{ margin:.4em 0; }
ul,ol{ margin:.3em 0; padding-inline-start:1.4em; }
li{ margin:.18em 0; }
a{ color:var(--brand); text-underline-offset:3px; }
img,svg{ max-width:100%; }
button,input,select,textarea{ font:inherit; color:inherit; }
hr{ border:0; border-top:1px solid var(--line); margin:1rem 0; }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; border-radius:6px; }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation:none !important; transition:none !important; scroll-behavior:auto !important; }
}
.splash{ min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
.splash-name{ font-weight:800; letter-spacing:.5px; color:var(--brand); font-size:1.3rem; margin:0; }
.sr-only{ position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.skip{ position:absolute; inset-inline-start:-9999px; top:0; background:var(--gold); color:var(--gold-ink); padding:.6rem 1rem; z-index:99; border-radius:0 0 10px 0; }
.skip:focus{ inset-inline-start:0; }

/* ===== assets/css/ui.css ===== */
/* ============================================================
   Najma · نجمة — Composants UI + écrans (RTL natif, skins par âge)
   ============================================================ */
#app{ max-width:680px; margin:0 auto; padding:0 12px calc(20px + env(safe-area-inset-bottom)); }
@media (min-width:760px){ #app{ max-width:860px; padding-bottom:40px; } }

/* ---- App bar ---- */
.appbar{ position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
  padding:max(10px, env(safe-area-inset-top)) 2px 10px;
  background:var(--bg); border-bottom:1px solid var(--line);
  box-shadow:0 6px 18px -14px rgba(9,42,74,.5); }

/* ---- Lecture protégée : aucun texte ne doit être masqué ni tronqué ---- */
html{ scroll-padding-top:calc(var(--appbar-h, 64px) + 12px); }
p, li, h1, h2, h3, h4, .opt, .task .tt, .listrow{ overflow-wrap:break-word; }
.row > bdi, .row > p{ flex:1 1 auto; min-width:0; overflow-wrap:anywhere; }
.opt > bdi{ flex:1 1 auto; min-width:0; overflow-wrap:anywhere; }
.appbar .brand-mini{ display:flex; align-items:center; gap:8px; font-weight:800; color:var(--brand); font-size:1.05rem; text-decoration:none; }
.appbar h1{ margin:0; font-size:1.1rem; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.appbar .spacer{ flex:1; }
.iconbtn{ display:inline-flex; align-items:center; justify-content:center; min-width:44px; min-height:44px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); border-radius:12px; cursor:pointer; }
.iconbtn svg{ width:20px; height:20px; }
[dir="rtl"] .i-chev, [dir="rtl"] .i-arrow{ transform:scaleX(-1); }

/* ---- Boutons ---- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:var(--btn-min);
  padding:.65rem 1.15rem; border-radius:var(--r); border:1px solid transparent; font-weight:700; cursor:pointer;
  text-decoration:none; background:var(--surface2); color:var(--ink); transition:transform .08s ease, filter .15s ease; }
.btn:active{ transform:translateY(1px); }
.btn.primary{ background:var(--brand); color:var(--brand-ink); }
.btn.gold{ background:var(--gold); color:var(--gold-ink); }
.btn.ghost{ background:transparent; border-color:var(--line); }
.btn.danger{ background:var(--err); color:#fff; }
.btn.big{ width:100%; font-size:1.06rem; }
.btn svg{ width:19px; height:19px; }
.btn:disabled{ opacity:.55; cursor:not-allowed; }

/* ---- Cartes / listes ---- */
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:var(--pad); box-shadow:var(--shadow); margin:.6rem 0; }
.card h2,.card h3{ margin-top:0; }
.row{ display:flex; align-items:center; gap:10px; }
.row .grow{ flex:1; min-width:0; }
.grid{ display:grid; gap:10px; }
.grid.two{ grid-template-columns:1fr 1fr; }
@media (max-width:340px){ .grid.two{ grid-template-columns:1fr; } }
.list{ display:flex; flex-direction:column; gap:8px; }
.listrow{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:.7rem .8rem; cursor:pointer; text-align:start; width:100%; }
.listrow:active{ filter:brightness(.97); }
.listrow .t{ font-weight:700; }
.listrow .s{ font-size:.85rem; color:var(--ink2); }
.listrow .ic{ flex:0 0 auto; width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  background:var(--brand-deep); color:var(--gold); }
.listrow .ic svg{ width:22px; height:22px; }
[dir="rtl"] .listrow{ text-align:right; }
.tile{ display:flex; flex-direction:column; align-items:center; gap:8px; justify-content:center; min-height:104px; padding:12px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); cursor:pointer; box-shadow:var(--shadow);
  font-weight:700; text-align:center; width:100%; }
.tile .ic{ width:46px; height:46px; border-radius:14px; background:var(--brand-deep); color:var(--gold); display:flex; align-items:center; justify-content:center; }
.tile .ic svg{ width:26px; height:26px; }
.tile small{ color:var(--ink2); font-weight:600; }

/* ---- Chips, barres, badges ---- */
.chip{ display:inline-flex; align-items:center; gap:5px; padding:.18rem .6rem; border-radius:999px; font-size:.78rem; font-weight:700;
  background:var(--surface2); color:var(--ink2); border:1px solid var(--line); }
.chip.gold{ background:var(--gold); color:var(--gold-ink); border-color:transparent; }
.chip.ok{ background:var(--ok-bg); color:var(--ok); border-color:transparent; }
.chip.err{ background:var(--err-bg); color:var(--err); border-color:transparent; }
.chip.warn{ background:var(--warn-bg); color:var(--warn); border-color:transparent; }
.chip.brand{ background:var(--brand-deep); color:var(--gold); border-color:transparent; }
.progress{ height:9px; border-radius:999px; background:var(--surface2); overflow:hidden; border:1px solid var(--line); }
.progress > i{ display:block; height:100%; background:linear-gradient(90deg, var(--gold-deep), var(--gold)); border-radius:999px; transition:width .3s ease; }
[dir="rtl"] .progress > i{ background:linear-gradient(270deg, var(--gold-deep), var(--gold)); }
.stat{ text-align:center; padding:.5rem; }
.stat b{ display:block; font-size:1.3rem; color:var(--brand); }
.stat span{ font-size:.8rem; color:var(--ink2); }
.badge-medal{ display:flex; flex-direction:column; align-items:center; gap:4px; padding:.6rem; border-radius:var(--r); background:var(--surface);
  border:1px solid var(--line); font-size:.72rem; font-weight:700; text-align:center; min-width:86px; }
.badge-medal .ic{ width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--gold); color:var(--gold-ink); }
.badge-medal.locked{ opacity:.45; filter:grayscale(1); }
.badge-medal .ic svg{ width:20px; height:20px; }
.streak{ display:inline-flex; align-items:center; gap:6px; font-weight:800; color:var(--ocre); }
.streak svg{ width:18px; height:18px; fill:var(--ocre); }

/* ---- Formulaire ---- */
.field{ display:block; margin:.7rem 0; }
.field span{ display:block; font-size:.88rem; font-weight:700; color:var(--ink2); margin-bottom:.3rem; }
input[type="text"],input[type="number"],input[type="date"],select,textarea{ width:100%; min-height:var(--btn-min); padding:.6rem .8rem;
  border:1.5px solid var(--line); border-radius:var(--r-sm); background:var(--surface); }
textarea{ min-height:90px; }
.pick{ display:flex; flex-wrap:wrap; gap:8px; }
.pick button{ min-height:46px; padding:.4rem .8rem; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); font-weight:700; cursor:pointer; }
.pick button[aria-pressed="true"]{ background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }

/* ---- Onglets ---- */
.tabs{ display:flex; gap:6px; overflow-x:auto; padding:8px 0; scrollbar-width:none; }
.tabs::-webkit-scrollbar{ display:none; }
.tabs button{ flex:1 0 auto; min-height:44px; padding:.4rem .9rem; border-radius:999px; border:1.5px solid var(--line);
  background:var(--surface); font-weight:700; cursor:pointer; white-space:nowrap; }
.tabs button[aria-selected="true"]{ background:var(--brand-deep); color:var(--gold); border-color:var(--brand-deep); }

/* ---- Quiz ---- */
.qbar{ display:flex; align-items:center; gap:10px; margin:.6rem 0; }
.qbar .progress{ flex:1 1 auto; min-width:0; }
.qbar .n{ font-weight:800; color:var(--ink2); font-size:.9rem; white-space:nowrap; }
.qdots{ display:flex; gap:4px; flex:1; min-width:0; flex-wrap:wrap; }
.qdots i{ width:9px; height:9px; border-radius:999px; background:var(--line); transition:background .2s ease, width .2s ease; }
.qdots i.done{ background:var(--ok); }
.qdots i.bad{ background:var(--err); }
.qdots i.cur{ background:var(--gold-deep); width:20px; }
.opt.picked{ border-color:var(--brand); box-shadow:0 0 0 2px var(--gold); }
.opt{ display:flex; align-items:center; gap:10px; width:100%; text-align:start; min-height:var(--btn-min); padding:.7rem .85rem;
  border-radius:var(--r); border:1.5px solid var(--line); background:var(--surface); cursor:pointer; font-weight:600; margin:.45rem 0; }
[dir="rtl"] .opt{ text-align:right; }
.opt .k{ flex:0 0 auto; width:26px; height:26px; border-radius:8px; background:var(--surface2); color:var(--ink2); display:flex; align-items:center; justify-content:center; font-size:.8rem; font-weight:800; }
.opt.correct{ background:var(--ok-bg); border-color:var(--ok); color:var(--ok); font-weight:800; }
.opt.correct .k{ background:var(--ok); color:#fff; }
.opt.wrong{ background:var(--err-bg); border-color:var(--err); color:var(--err); }
.opt.wrong .k{ background:var(--err); color:#fff; }
.opt:disabled{ cursor:default; }
.feedback{ border-radius:var(--r); padding:.7rem .85rem; margin:.5rem 0; border-inline-start:4px solid var(--ok); background:var(--ok-bg); }
.feedback.bad{ border-inline-start-color:var(--err); background:var(--err-bg); }
.feedback .why{ font-size:.9rem; color:var(--ink2); margin-top:.3rem; }

/* ---- Flashcards (carte robuste : pas de 3D, flip piloté en JS) ---- */
.fcwrap{ margin:1rem 0; }
.fc{ min-height:230px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5rem;
  text-align:center; background:var(--surface); border:1.5px solid var(--line); border-radius:18px; padding:22px 18px;
  cursor:pointer; transition:transform .12s ease, background .25s ease, color .25s ease; overflow-wrap:break-word; width:100%; }
.fc:active{ transform:scale(.985); }
.fc.revealed{ background:var(--brand-deep); color:var(--gold); border-color:var(--brand-deep); }
.fc .big{ font-size:1.15rem; font-weight:800; line-height:1.6; max-width:100%; }
.fc .hint{ font-size:.8rem; color:var(--ink2); margin-top:.4rem; }
.fc.revealed .hint{ color:var(--gold); opacity:.85; }
.fc .tag{ font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; opacity:.85; }

/* ---- Fiche de cours ---- */
.def{ background:var(--surface2); border-inline-start:4px solid var(--gold-deep); border-radius:var(--r-sm); padding:.6rem .8rem; margin:.5rem 0; }
.def b{ color:var(--brand); }
.formule{ background:var(--brand-deep); color:var(--gold); border-radius:var(--r-sm); padding:.65rem .9rem; margin:.5rem 0;
  font-weight:700; text-align:center; font-size:1.05rem; direction:ltr; }
table.tbl{ width:100%; border-collapse:collapse; margin:.6rem 0; font-size:.92rem; }
table.tbl th,table.tbl td{ border:1px solid var(--line); padding:.45rem .5rem; text-align:center; }
table.tbl th{ background:var(--surface2); }
.exo{ border:1px solid var(--line); border-radius:var(--r); background:var(--surface); padding:.8rem; margin:.6rem 0; }
.exo-head{ display:flex; align-items:center; gap:8px; margin-bottom:.4rem; }
.exo-text{ margin:.15rem 0 .55rem; line-height:1.65; }
.exo-actions{ display:flex; flex-wrap:wrap; gap:8px; margin:.3rem 0; }
.exo-actions input{ flex:1 1 150px; min-width:130px; }
.exo .num{ display:inline-flex; width:28px; height:28px; border-radius:50%; background:var(--brand-deep); color:var(--gold); align-items:center; justify-content:center; font-weight:800; font-size:.85rem; margin-inline-end:8px; }
.exo .steps li{ margin:.3rem 0; }
.sol{ border-top:1px dashed var(--line); margin-top:.6rem; padding-top:.6rem; }
.example{ background:var(--surface2); border-radius:var(--r); padding:.8rem; margin:.6rem 0; }
.example .tag{ font-size:.75rem; font-weight:800; color:var(--ocre-deep); text-transform:uppercase; letter-spacing:.06em; }

/* ---- Examen ---- */
.timerbar{ position:sticky; top:calc(var(--appbar-h, 64px) + 6px); z-index:15; display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:.5rem .8rem; margin:.5rem 0; box-shadow:var(--shadow); }
.timerbar .clock{ font-variant-numeric:tabular-nums; font-weight:800; color:var(--brand); white-space:nowrap; }
.timerbar.low .clock{ color:var(--err); }
.timerbar .progress{ flex:1; }
.sec-title{ margin:1.1rem 0 .4rem; display:flex; align-items:center; gap:8px; color:var(--brand); }
.sec-title small{ color:var(--ink2); font-weight:600; }
.examcard .qhead{ align-items:flex-start; }
.qnum{ flex:0 0 auto; min-width:30px; height:30px; padding:0 7px; border-radius:10px; background:var(--brand-deep); color:var(--gold);
  display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:.8rem; font-variant-numeric:tabular-nums; }
.examcard .pts{ display:flex; justify-content:flex-end; margin-top:.45rem; }
.result-hero{ text-align:center; padding:1.2rem; border-radius:var(--r); background:var(--brand-deep); color:#fff; margin:.8rem 0; }
.result-hero b{ font-size:2.2rem; color:var(--gold); display:block; }
.selfscore{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:.5rem; }
.selfscore button{ min-width:40px; min-height:40px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); font-weight:800; cursor:pointer; }
.selfscore button[aria-pressed="true"]{ background:var(--gold); color:var(--gold-ink); border-color:var(--gold-deep); }

/* ---- Planning ---- */
.plan-day{ border:1px solid var(--line); border-radius:var(--r); background:var(--surface); padding:.7rem .85rem; margin:.55rem 0; }
.plan-day .d{ font-weight:800; color:var(--brand); display:flex; align-items:center; gap:8px; }
.plan-day.today{ border-color:var(--gold-deep); box-shadow:0 0 0 2px var(--gold); }
.task{ display:flex; align-items:center; gap:10px; padding:.35rem 0; border-top:1px dashed var(--line); margin-top:.35rem; }
.task:first-of-type{ border-top:0; margin-top:0; }
.task input[type="checkbox"]{ width:22px; height:22px; accent-color:var(--brand); }
.task .tt{ flex:1; font-weight:600; }
.task .min{ font-size:.8rem; color:var(--ink2); white-space:nowrap; }
.task.done .tt{ text-decoration:line-through; color:var(--ink2); }
.task .kind{ font-size:.7rem; font-weight:800; padding:.1rem .5rem; border-radius:999px; background:var(--surface2); color:var(--ink2); }
.task .kind.k-cours{ background:var(--brand-deep); color:var(--gold); }
.task .kind.k-examen{ background:var(--err-bg); color:var(--err); }

/* ---- Modale / toast ---- */
.modal-back{ position:fixed; inset:0; background:rgba(9,42,74,.5); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
.modal{ background:var(--surface); border-radius:var(--r); max-width:420px; width:100%; padding:1rem; box-shadow:var(--shadow); }
.modal .actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:.8rem; }
.toast{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--brand-deep); color:#fff; padding:.7rem 1.1rem;
  border-radius:999px; font-weight:700; z-index:60; box-shadow:var(--shadow); max-width:92vw; text-align:center; animation:toastin .25s ease; }
[dir="rtl"] .toast{ transform:translateX(50%); }
@keyframes toastin{ from{ opacity:0; translate:0 8px; } to{ opacity:1; translate:0 0; } }

/* ---- Onboarding ---- */
.langpick{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:1rem 0; }
.langpick button{ min-height:110px; border-radius:var(--r); border:2px solid var(--line); background:var(--surface); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:1.1rem; font-weight:800; }
.langpick button[aria-pressed="true"]{ border-color:var(--gold-deep); box-shadow:0 0 0 3px var(--gold); }
.hero{ text-align:center; padding:1.6rem 0 .6rem; }
.hero .mascot{ width:110px; height:110px; }
.hero p{ color:var(--ink2); }
.lvlgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.lvlgrid button{ min-height:56px; border-radius:var(--r); border:2px solid var(--line); background:var(--surface); font-weight:800; cursor:pointer; }
.lvlgrid button[aria-pressed="true"]{ background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }
.lvlgrid button small{ display:block; font-size:.68rem; font-weight:600; color:var(--ink2); }
.lvlgrid button[aria-pressed="true"] small{ color:var(--gold); }
.cyclelabel{ font-size:.8rem; font-weight:800; color:var(--ocre-deep); margin:.8rem 0 .35rem; text-transform:uppercase; letter-spacing:.05em; }

/* ---- Divers écrans ---- */
.toolgrid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.section-t{ display:flex; align-items:center; gap:8px; margin:1.1rem 0 .4rem; color:var(--ink2); font-size:.85rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; }
.empty{ text-align:center; color:var(--ink2); padding:2rem 1rem; }
.empty svg{ width:56px; height:56px; opacity:.5; }
.unitrow .pct{ font-weight:800; color:var(--brand); font-variant-numeric:tabular-nums; }
.kbd{ font-family:ui-monospace,monospace; background:var(--surface2); border:1px solid var(--line); border-radius:6px; padding:0 .35rem; }
.note-edit{ font-size:.82rem; color:var(--warn); background:var(--warn-bg); border-radius:var(--r-sm); padding:.5rem .7rem; margin:.5rem 0; }
.countdown{ font-variant-numeric:tabular-nums; }

/* ---- Skins par âge ---- */
body[data-skin="fondamental"]{ --r:22px; --r-sm:16px; --btn-min:56px; --pad:16px; }
body[data-skin="fondamental"] .tile{ min-height:130px; font-size:1.06rem; }
body[data-skin="fondamental"] .opt{ font-size:1.05rem; }
body[data-skin="fondamental"] .tabs button{ font-size:1rem; min-height:52px; }
body[data-skin="lycee"]{ --r:10px; --r-sm:7px; --btn-min:42px; --pad:12px; }
body[data-skin="lycee"] .tile{ min-height:84px; }
body[data-skin="lycee"] .card{ padding:11px; }
body[data-skin="lycee"] .formule{ font-size:.98rem; }

/* ============================================================
   content.js — Accès au contenu pédagogique (JSON statiques)
   catalogue.json est chargé une fois ; chaque unité / examen est
   récupéré à la demande (lazy) et mis en cache mémoire.
   ============================================================ */
let catalogue = null;
let matieres = null;
const unitCache = new Map();
const examCache = new Map();

/* Version « fichier unique » : tout le contenu est embarqué dans la page
   (globalThis.NAJMA_CONTENT) → aucun fetch, fonctionne même en file://. */
const EMBED = globalThis.NAJMA_CONTENT || null;

async function loadCatalogue(force = false) {
  if (!catalogue || force) {
    if (EMBED) { catalogue = EMBED.catalogue; return catalogue; }
    const res = await fetch('content/catalogue.json');
    if (!res.ok) throw new Error('catalogue.json introuvable');
    catalogue = await res.json();
  }
  return catalogue;
}

/* Repli de sécurité : si _matieres.json est absent (hébergeur qui exclut
   les fichiers à underscore), l'app fonctionne quand même. */
const MATIERES_FALLBACK = {
  arabe: { label: { fr: 'Arabe · اللغة العربية', ar: 'اللغة العربية' }, icone: 'book' },
  francais: { label: { fr: 'Français · الفرنسية', ar: 'الفرنسية' }, icone: 'pen' },
  mathematiques: { label: { fr: 'Mathématiques · الرياضيات', ar: 'الرياضيات' }, icone: 'calc' },
  sciences: { label: { fr: 'Sciences · العلوم', ar: 'العلوم' }, icone: 'flask' },
  sciences_naturelles: { label: { fr: 'Sciences naturelles · علوم الطبيعة والحياة', ar: 'علوم الطبيعة والحياة' }, icone: 'leaf' },
  physique_chimie: { label: { fr: 'Physique-Chimie · الفيزياء والكيمياء', ar: 'الفيزياء والكيمياء' }, icone: 'atom' },
  histoire_geo: { label: { fr: 'Histoire-Géographie · التاريخ والجغرافيا', ar: 'التاريخ والجغرافيا' }, icone: 'globe' },
  education_islamique: { label: { fr: 'Éducation islamique · التربية الإسلامية', ar: 'التربية الإسلامية' }, icone: 'star' },
  anglais: { label: { fr: 'Anglais · الإنجليزية', ar: 'الإنجليزية' }, icone: 'globe' },
  philosophie: { label: { fr: 'Philosophie · الفلسفة', ar: 'الفلسفة' }, icone: 'book' },
};

async function loadMatieres() {
  if (!matieres) {
    if (EMBED) { matieres = EMBED.matieres; return matieres; }
    try {
      const res = await fetch('content/_matieres.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data || typeof data !== 'object' || !data.mathematiques) throw new Error('format invalide');
      matieres = data;
    } catch {
      matieres = MATIERES_FALLBACK; // l'app ne doit jamais s'arrêter pour ce fichier
    }
  }
  return matieres;
}

function getCatalogue() {
  if (!catalogue) throw new Error('Catalogue non chargé');
  return catalogue;
}

function niveauById(id) {
  return getCatalogue().niveaux.find(n => n.id === id) || null;
}

function uniteById(id) {
  return getCatalogue().unites.find(u => u.id === id) || null;
}

function examenById(id) {
  return getCatalogue().examens.find(e => e.id === id) || null;
}

/** Matières d'un niveau (avec série pour le 7AS). */
function matieresOf(niveauId, serie) {
  const n = niveauById(niveauId);
  if (!n) return [];
  let ids = [...n.matieres];
  if (niveauId === '7AS' && serie) {
    const s = getCatalogue().series['7AS'].find(x => x.id === serie);
    if (s) ids = ids.concat(s.matieresExtra);
  }
  return ids;
}

function unitesOf(niveauId, matiereId) {
  return getCatalogue().unites
    .filter(u => u.niveau === niveauId && u.matiere === matiereId)
    .sort((a, b) => a.ordre - b.ordre);
}

function examensOf(niveauId) {
  return getCatalogue().examens.filter(e => e.niveau === niveauId);
}

/** Charge un fichier d'unité (fiche, exercices, quiz, flashcards). */
async function fetchUnite(path) {
  if (!unitCache.has(path)) {
    if (EMBED) { unitCache.set(path, EMBED.unites[path]); return unitCache.get(path); }
    const res = await fetch('content/' + path);
    if (!res.ok) throw new Error('Unité introuvable: ' + path);
    unitCache.set(path, await res.json());
  }
  return unitCache.get(path);
}

/** Charge un examen blanc. `path` inclut le préfixe « examens/ » (cf. catalogue). */
async function fetchExamen(path) {
  if (!examCache.has(path)) {
    if (EMBED) { examCache.set(path, EMBED.examens[path]); return examCache.get(path); }
    const res = await fetch('content/' + path);
    if (!res.ok) throw new Error('Examen introuvable: ' + path);
    examCache.set(path, await res.json());
  }
  return examCache.get(path);
}
return { examenById, examensOf, fetchExamen, fetchUnite, getCatalogue, loadCatalogue, loadMatieres, matieresOf, niveauById, uniteById, unitesOf };
});

__def('assets/js/core/db.js', () => {
/* ============================================================
   db.js — Couche de stockage local unifiée
   IndexedDB → fallback localStorage → fallback mémoire.
   Toutes les données Najma vivent sous des clés simples (KV).
   ============================================================ */
const DB_NAME = 'najma';
const DB_VERSION = 1;
const STORE = 'kv';
const LS_PREFIX = 'najma:';

let mode = null;          // 'idb' | 'ls' | 'mem'
let dbPromise = null;
const MEMORY = new Map();

function detect() {
  try {
    if (typeof indexedDB !== 'undefined' && indexedDB) { mode = 'idb'; return; }
  } catch { /* ignore */ }
  try {
    if (typeof localStorage !== 'undefined') {
      localStorage.setItem('__najma_probe__', '1');
      localStorage.removeItem('__najma_probe__');
      mode = 'ls';
      return;
    }
  } catch { /* ignore */ }
  mode = 'mem';
}

function openIdb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('IndexedDB bloqué'));
  });
  dbPromise.catch(() => { dbPromise = null; });
  return dbPromise;
}

function txRun(modeTx, fn) {
  return openIdb().then(db => new Promise((resolve, reject) => {
    const t = db.transaction(STORE, modeTx);
    const s = t.objectStore(STORE);
    const req = fn(s);
    t.oncomplete = () => resolve(req ? req.result : undefined);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error || new Error('Transaction annulée'));
  }));
}

/** Degrade proprement si IndexedDB est indisponible/corrompu. */
function degrade() {
  if (mode === 'idb') mode = (typeof localStorage !== 'undefined') ? 'ls' : 'mem';
  else mode = 'mem';
}

async function kvGet(key) {
  if (!mode) detect();
  try {
    if (mode === 'idb') return await txRun('readonly', s => s.get(key));
    if (mode === 'ls') {
      const raw = localStorage.getItem(LS_PREFIX + key);
      return raw == null ? undefined : JSON.parse(raw);
    }
    return MEMORY.has(key) ? MEMORY.get(key) : undefined;
  } catch (e) {
    degrade();
    return kvGet(key);
  }
}

async function kvSet(key, value) {
  if (!mode) detect();
  try {
    if (mode === 'idb') { await txRun('readwrite', s => s.put(value, key)); return; }
    if (mode === 'ls') { localStorage.setItem(LS_PREFIX + key, JSON.stringify(value)); return; }
    MEMORY.set(key, value);
  } catch (e) {
    degrade();
    return kvSet(key, value);
  }
}

async function kvDel(key) {
  if (!mode) detect();
  try {
    if (mode === 'idb') { await txRun('readwrite', s => s.delete(key)); return; }
    if (mode === 'ls') { localStorage.removeItem(LS_PREFIX + key); return; }
    MEMORY.delete(key);
  } catch (e) {
    degrade();
    return kvDel(key);
  }
}

async function storageKind() {
  if (!mode) detect();
  return mode;
}
return { kvDel, kvGet, kvSet, storageKind };
});

let lang = 'fr';

/** Change la langue et bascule la direction du document. */
function setLang(l) {
  lang = (l === 'ar') ? 'ar' : 'fr';
  if (typeof document === 'undefined') return; // environnement hors navigateur (tests)
  const de = document.documentElement;
  de.lang = lang;
  de.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  document.body?.setAttribute('dir', de.dir);
  document.body?.setAttribute('lang', lang);
}

function getLang() { return lang; }

/** Chaîne d'interface traduite ; remplace {var}. */
function t(key, vars) {
  const s = (DICT[lang] && DICT[lang][key]) ?? DICT.fr[key] ?? key;
  return vars ? s.replace(/\{(\w+)\}/g, (_, n) => String(vars[n] ?? '')) : s;
}

/** Contenu bilingue {fr, ar} → chaîne dans la langue active. */
function bi(obj) {
  if (obj == null) return '';
  if (typeof obj === 'string') return obj;
  return obj[lang] || obj.fr || obj.ar || '';
}

/** Formatage numérique local (chiffres latins en arabe mauritanien aussi). */
function nf(n) {
  try { return new Intl.NumberFormat(lang === 'ar' ? 'ar-MR-u-nu-latn' : 'fr-FR').format(n); }
  catch { return String(n); }
}

/** Date locale au format court (ex: 24/11/2026). */
function dfDate(iso) {
  try { return new Intl.DateTimeFormat(lang === 'ar' ? 'ar-MR-u-nu-latn' : 'fr-FR').format(new Date(iso + 'T12:00:00')); }
  catch { return iso; }
}
return { LANGS, bi, dfDate, getLang, nf, setLang, t };
});

__def('assets/js/core/leitner.js', () => {
/* ============================================================
   leitner.js — Répétition espacée (système Leitner, 5 boîtes).
   Boîte 0 = carte neuve ; réussite → boîte suivante ; échec → boîte 1.
   Intervalle de rappel (jours) : 0, 1, 2, 4, 8, 16.
   Clé d'une carte : "u:<unité>:<id>" (quiz/flashcard) — examens → carnet.
   ============================================================ */
const BOX_DAYS = [0, 1, 2, 4, 8, 16]; // index = boîte 0..5
const NB_BOXES = 5;

const DAY_MS = 24 * 60 * 60 * 1000;

function newSrsItem(ref) {
  return { ref, box: 0, due: 0, seen: 0, ok: 0, ko: 0 };
}

/** Met à jour une carte après une réponse. */
function gradeItem(item, ok, now = Date.now()) {
  item.box = ok ? Math.min(NB_BOXES, item.box + 1) : 1;
  item.due = now + BOX_DAYS[item.box] * DAY_MS;
  item.seen += 1;
  if (ok) item.ok += 1; else item.ko += 1;
  return item;
}

function isDue(item, now = Date.now()) {
  return !item.due || item.due <= now;
}

/** Cartes à revoir maintenant (dues) parmi un dictionnaire {ref: item}. */
function dueItems(srsMap, now = Date.now()) {
  return Object.values(srsMap || {}).filter(i => isDue(i, now));
}

/** Nombre de cartes maîtrisées (boîte 5). */
function masteredCount(srsMap) {
  return Object.values(srsMap || {}).filter(i => i.box >= NB_BOXES).length;
}

/** Récupère (ou crée) la carte d'une ref dans le profil. */
function getItem(srsMap, ref) {
  if (!srsMap[ref]) srsMap[ref] = newSrsItem(ref);
  return srsMap[ref];
}
return { BOX_DAYS, NB_BOXES, dueItems, getItem, gradeItem, isDue, masteredCount, newSrsItem };
});

__def('assets/js/core/planner.js', () => {
/* ============================================================
   planner.js — Planificateur de révision.
   Entrée : date d'examen, temps dispo/jour, unités à couvrir.
   Sortie : planning quotidien réaliste (cours → révision → carnet
   → examens blancs en fin de parcours).
   ============================================================ */

const DAY_MS = 24 * 60 * 60 * 1000;

function listDays(startISO, endISO) {
  const days = [];
  const start = new Date(startISO + 'T12:00:00');
  const end = new Date(endISO + 'T12:00:00');
  for (let d = start.getTime(); d < end.getTime(); d += DAY_MS) {
    const dt = new Date(d);
    days.push(`${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`);
  }
  return days;
}

const TASKS = {
  cours: { fr: 'Leçon : {x}', ar: 'الدرس: {x}' },
  quiz: { fr: 'Quiz de contrôle : {x}', ar: 'اختبار قصير: {x}' },
  flashcards: { fr: 'Flashcards : {x}', ar: 'بطاقات التعلم: {x}' },
  revision: { fr: 'Révision des boîtes Leitner (cartes dues)', ar: 'مراجعة صناديق لايتنر (البطاقات المستحقة)' },
  carnet: { fr: "Carnet d'erreurs", ar: 'دفتر الأخطاء' },
  examen: { fr: 'Examen blanc chronométré', ar: 'امتحان تجريبي محدَّد الوقت' },
};

function task(kind, ref, titre, minutes) {
  return { kind, ref: ref || null, titre, minutes, done: false };
}

/**
 * Génère le planning. `unites` : [{id, titre:{fr,ar}, duree_min}]
 * La densité s'adapte : si peu de jours, les révisions libres sont réduites.
 */
function makePlan({ endISO, minutesPerDay, unites, startISO }) {
  const start = startISO || new Date().toISOString().slice(0, 10);
  const days = listDays(start, endISO);
  if (days.length === 0) return null;

  const n = days.length;
  const newUnits = unites.slice();
  const intensif = n <= 5;
  const plan = { examDate: endISO, created: start, minutesPerDay, days: [] };

  days.forEach((date, idx) => {
    const tasks = [];
    const rest = n - idx; // jours restants (1 = veille de l'examen)

    if (rest <= 2) {
      tasks.push(task('revision', null, TASKS.revision, Math.round(minutesPerDay * 0.5)));
      tasks.push(task('carnet', null, TASKS.carnet, Math.round(minutesPerDay * 0.3)));
      tasks.push(task('examen', null, TASKS.examen, Math.round(minutesPerDay * 0.2)));
    } else if (rest <= 4) {
      tasks.push(task('examen', null, TASKS.examen, Math.round(minutesPerDay * 0.6)));
      tasks.push(task('revision', null, TASKS.revision, Math.round(minutesPerDay * 0.4)));
    } else {
      const budget = minutesPerDay;
      let used = 0;
      // 1 nouvelle leçon (si disponible)
      if (newUnits.length) {
        const u = newUnits.shift();
        const m = Math.min(u.duree_min || 25, Math.round(budget * 0.6));
        tasks.push(task('cours', u.id, fill(TASKS.cours, u.titre), m));
        tasks.push(task('quiz', u.id, fill(TASKS.quiz, u.titre), 8));
        used += m + 8;
      }
      // Une leçon sur 3 : jour de synthèse (flashcards + carnet)
      if (!intensif && (idx % 3 === 2)) {
        tasks.push(task('flashcards', null, TASKS.flashcards, 10));
        tasks.push(task('carnet', null, TASKS.carnet, 10));
        used += 20;
      } else if (!intensif) {
        tasks.push(task('revision', null, TASKS.revision, 10));
        used += 10;
      }
      // S'il reste du budget et des leçons : une 2e leçon légère
      if (newUnits.length && used + 20 <= budget) {
        const u2 = newUnits.shift();
        tasks.push(task('cours', u2.id, fill(TASKS.cours, u2.titre), Math.min(u2.duree_min || 25, 20)));
      }
    }
    plan.days.push({ date, tasks });
  });

  // S'il reste des leçons non placées, les insérer dans les jours "examen"
  if (newUnits.length) {
    for (const d of plan.days) {
      if (!newUnits.length) break;
      const u = newUnits.shift();
      d.tasks.push(task('cours', u.id, fill(TASKS.cours, u.titre), Math.min(u.duree_min || 25, 15)));
    }
  }
  return plan;
}

function fill(tpl, titre) {
  return {
    fr: tpl.fr.replace('{x}', titre?.fr || ''),
    ar: tpl.ar.replace('{x}', titre?.ar || ''),
  };
}

function planProgress(plan) {
  let total = 0, done = 0;
  for (const d of plan.days) for (const t of d.tasks) { total++; if (t.done) done++; }
  return { total, done, pct: total ? Math.round(100 * done / total) : 0 };
}
return { makePlan, planProgress };
});

/* ============================================================
   router.js — Routeur à hash (#/chemin), écrans chargés en différé.
   Chaque écran est un module importé dynamiquement → poids minimal
   au démarrage (smartphones d'entrée de gamme, 3G instable).
   ============================================================ */
const { el } = __req('assets/js/ui/components.js');

const routes = [];
let outlet = null;
let cleanupFn = null;
let renderSeq = 0;

/** Enregistre l'élément racine et les définitions d'écrans. */
function initRouter(outletEl, defs) {
  outlet = outletEl;
  defs.forEach(d => routes.push(d));
  window.addEventListener('hashchange', render);
  render();
}

function navigate(hash) {
  if (location.hash === hash) render();
  else location.hash = hash;
}

function currentPath() {
  return (location.hash || '#/').replace(/^#/, '') || '/';
}

async function render() {
  const path = currentPath();
  const token = ++renderSeq;
  let def = null, match = null;
  for (const d of routes) {
    match = path.match(d.re);
    if (match) { def = d; break; }
  }
  if (cleanupFn) { try { cleanupFn(); } catch { /* noop */ } cleanupFn = null; }
  outlet.textContent = '';
  window.scrollTo(0, 0);
  if (!def) {
    outlet.append(el('div', { class: 'empty' },
      el('h2', {}, '404'), el('p', {}, path)));
    return;
  }
  try {
    const mod = await __dimport(def.src);
    const fn = mod[def.exp] || mod.build;
    if (typeof fn !== 'function') throw new Error('Fonction d\u2019écran introuvable : ' + (def.exp || 'build'));
    const view = await fn(match.slice(1), outlet);
    if (token !== renderSeq) return; // une navigation plus récente a pris le dessus
    if (!view) return;
    if (view instanceof Node) outlet.append(view);
    else {
      if (view.cleanup) cleanupFn = view.cleanup;
      if (view.root) outlet.append(view.root);
    }
  } catch (err) {
    console.error('Écran', path, err);
    if (token === renderSeq) {
      outlet.append(el('div', { class: 'empty' },
        el('h2', {}, 'Oups / عذرًا'),
        el('p', {}, String(err && err.message || err))));
    }
  }
}
return { initRouter, navigate };
});

/* ============================================================
   store.js — État applicatif : profils multiples, progression,
   boîtes Leitner, carnet d'erreurs, réglages. 100 % local.
   ============================================================ */
const { kvGet, kvSet, kvDel } = __req('assets/js/core/db.js');

let cache = null; // { settings, profiles:[Profile], data:{ [profileId]:ProfileData } }

const todayISO = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};

function newProfileData() {
  return {
    xp: 0,
    streak: { count: 0, best: 0, last: null },
    history: [],            // [{date, kind, minutes}] pour l'espace parent
    progress: {},           // unitId → {fiche, quizBest, exDone:[], done}
    srs: {},                // ref → {box, due, seen, ok, ko}
    errors: [],             // carnet d'erreurs (questions ratées)
    badges: [],             // [{id, date}]
    counters: { quizPerfect: 0, examsDone: 0, carnetCleared: 0, cardsMastered: 0 },
    plan: null,             // planning généré
    parentPin: null,        // hash simple du PIN local
    lastUnit: null,
    createdAt: todayISO(),
  };
}

/** Charge réglages + profils depuis le stockage local. */
async function initStore() {
  cache = {
    settings: await kvGet('settings') || { lang: null, theme: 'auto', font: 'm', seenLang: false },
    profiles: await kvGet('profiles') || [],
    data: {},
  };
  for (const p of cache.profiles) {
    cache.data[p.id] = (await kvGet('profile:' + p.id)) || newProfileData();
  }
  return cache;
}

function getStore() {
  if (!cache) throw new Error('Store non initialisé');
  return cache;
}

function currentProfile() {
  if (!cache) return null;
  return cache.profiles.find(p => p.id === cache.settings.currentProfile) || cache.profiles[0] || null;
}

function profileData(pid) {
  const p = currentProfile();
  return cache.data[(pid || (p && p.id))] || null;
}

async function persistMeta() {
  await kvSet('settings', cache.settings);
  await kvSet('profiles', cache.profiles);
}

async function persistProfile(pid) {
  const p = currentProfile();
  const id = pid || (p && p.id);
  if (id && cache.data[id]) await kvSet('profile:' + id, cache.data[id]);
}

/* ---------- Profils ---------- */

function listProfiles() { return cache.profiles; }

async function createProfile({ name, lang, niveau, serie }) {
  const profile = {
    id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    name: String(name || 'Élève').trim().slice(0, 24),
    lang, niveau, serie: serie || null,
  };
  cache.profiles.push(profile);
  cache.data[profile.id] = newProfileData();
  cache.settings.currentProfile = profile.id;
  if (!cache.settings.lang) cache.settings.lang = lang;
  await persistMeta();
  await persistProfile(profile.id);
  return profile;
}

async function switchProfile(id) {
  if (!cache.profiles.some(p => p.id === id)) return;
  cache.settings.currentProfile = id;
  await persistMeta();
}

async function updateProfile(id, patch) {
  const p = cache.profiles.find(x => x.id === id);
  if (!p) return;
  Object.assign(p, patch);
  await persistMeta();
}

async function deleteProfile(id) {
  cache.profiles = cache.profiles.filter(p => p.id !== id);
  delete cache.data[id];
  await kvDel('profile:' + id);
  if (cache.settings.currentProfile === id) {
    cache.settings.currentProfile = cache.profiles[0] ? cache.profiles[0].id : null;
  }
  await persistMeta();
}

/* ---------- Réglages ---------- */

async function setSettings(patch) {

  await persistMeta();

function addXp(data, amount) {
  data.xp += Math.max(0, Math.round(amount));

/** Marque l'activité du jour et calcule la série de jours. */
function touchStreak(data, kind = 'revision', minutes = 5) {
  const today = todayISO();
  const last = data.streak.last;
  if (last !== today) {
    const y = new Date(); y.setDate(y.getDate() - 1);
    const yesterday = `${y.getFullYear()}-${String(y.getMonth() + 1).padStart(2, '0')}-${String(y.getDate()).padStart(2, '0')}`;
    data.streak.count = (last === yesterday) ? data.streak.count + 1 : 1;
    data.streak.last = today;
    data.streak.best = Math.max(data.streak.best, data.streak.count);
  }
  const h = data.history.find(x => x.date === today);
  if (h) { h.count = (h.count || 1) + 1; h.minutes += minutes; }
  else data.history.push({ date: today, kind, minutes });
  if (data.history.length > 400) data.history = data.history.slice(-400);
}

/* ---------- Badges ---------- */

const BADGE_DEFS = [
  { id: 'p1', key: 'badge_p1', test: d => d.history.length >= 1 },
  { id: 's3', key: 'badge_s3', test: d => d.streak.best >= 3 },
  { id: 's7', key: 'badge_s7', test: d => d.streak.best >= 7 },
  { id: 'qp', key: 'badge_qp', test: d => d.counters.quizPerfect >= 1 },
  { id: 'c20', key: 'badge_c20', test: d => d.counters.cardsMastered >= 20 },
  { id: 'ex1', key: 'badge_ex1', test: d => d.counters.examsDone >= 1 },
  { id: 'cz', key: 'badge_cz', test: d => d.counters.carnetCleared >= 1 },
];

/** Vérifie et attribue les nouveaux badges ; renvoie ceux nouvellement gagnés. */
function checkBadges(data) {
  const won = [];
  for (const b of BADGE_DEFS) {
    if (!data.badges.some(x => x.id === b.id) && b.test(data)) {
      data.badges.push({ id: b.id, date: todayISO() });
      won.push(b);
    }
  }
  return won;
}

/* ---------- Carnet d'erreurs ---------- */

function addError(data, entry) {
  if (!data.errors.some(e => e.key === entry.key)) {
    data.errors.push({ ...entry, streakOk: 0 });
  }
}

function removeError(data, key) {

  data.errors = data.errors.filter(e => e.key !== key);
  if (before > 0 && data.errors.length === 0) data.counters.carnetCleared++;
  return before - data.errors.length;
}

/* ---------- Export / Import ---------- */

async function exportAll() {
  const payload = { app: 'najma', version: 1, exportedAt: new Date().toISOString(), data: {} };
  payload.settings = cache.settings;
  payload.profiles = cache.profiles;
  for (const p of cache.profiles) {
    payload.data[p.id] = cache.data[p.id];

}

async function importAll(payload) {
  if (!payload || payload.app !== 'najma' || !Array.isArray(payload.profiles)) {
    throw new Error('format');
  }
  cache.settings = payload.settings || cache.settings;
  cache.profiles = payload.profiles;
  cache.data = {};
  for (const p of cache.profiles) {
    cache.data[p.id] = payload.data?.[p.id] || newProfileData();
    await kvSet('profile:' + p.id, cache.data[p.id]);

});

/* ============================================================
   flashcards.js — Cartes mémoire avec auto-évaluation
   ("Je savais" / "À revoir") branchée sur les boîtes Leitner.
   Priorité aux cartes dues, puis aux cartes neuves (max 12).
   ============================================================ */
const { el, icon, progressBar, toast } = __req('assets/js/ui/components.js');
const { t, bi, nf } = __req('assets/js/core/i18n.js');
const { getItem, gradeItem, isDue, NB_BOXES } = __req('assets/js/core/leitner.js');
const { addXp, touchStreak, checkBadges, persistProfile } = __req('assets/js/core/store.js');

function selectDueCards(cards, srsMap, max = 12) {
  const due = cards.filter(c => {
    const it = srsMap[`f:${c.id}`];
    return !it || isDue(it);
  });
  const rest = cards.filter(c => {
    const it = srsMap[`f:${c.id}`];
    return it && !isDue(it);
  });
  return due.slice(0, max).concat(rest.slice(0, 0));
}

/** Lance une session de flashcards dans `root`. */
function buildFlashcards(root, { data, unitId, cards }) {
  const session = selectDueCards(cards, data.srs);
  const view = el('section');
  root.textContent = '';

  if (!session.length) {
    view.append(el('div', { class: 'empty' }, icon('star'),
      el('p', { text: t('rienAfaire') })));
    root.append(view);
    return view;
  }

  let idx = 0, okCount = 0;
  const counter = el('div', { class: 'qbar' });
  const cardZone = el('div');
  const navZone = el('div');

  view.append(counter, cardZone, navZone);
  root.append(view);

  function render() {
    counter.textContent = '';
    counter.append(el('span', { class: 'n', text: `${nf(idx + 1)} / ${nf(session.length)}` }),
      progressBar(Math.round(100 * idx / session.length)));

    const c = session[idx];
    const ref = `f:${unitId}:${c.id}`;
    let flipped = false;

    const big = el('div', { class: 'big' });
    const hint = el('div', { class: 'hint' });
    const fc = el('div', { class: 'fc', role: 'button', tabindex: 0, 'aria-label': t('flip') }, big, hint);

    const draw = () => {
      big.textContent = '';
      navZone.textContent = '';
      if (!flipped) {
        big.append(el('bdi', { text: bi(c.recto) }));
        hint.textContent = t('flip');
      } else {
        big.append(el('div', { class: 'tag', text: t('resultat') }), el('bdi', { text: bi(c.verso) }));
        navZone.append(btns(c, ref));
      }
    };
    const flip = () => {
      flipped = !flipped;
      fc.classList.toggle('revealed', flipped);
      draw();
    };
    fc.addEventListener('click', flip);
    fc.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });

    cardZone.textContent = '';
    cardZone.append(el('div', { class: 'fcwrap' }, fc));
    draw();
  }

  function btns(c, ref) {
    const wrap = el('div', { class: 'grid two' });

      el('button', { class: 'btn', text: '🔁 ' + t('aRevoir'), onclick: () => grade(false) }),
      el('button', { class: 'btn primary', text: '✓ ' + t('jeSavais'), onclick: () => grade(true) }),
    );
    function grade(ok) {
      const item = getItem(data.srs, ref);
      const wasMastered = item.box >= NB_BOXES;
      gradeItem(item, ok);
      if (ok && item.box >= NB_BOXES && !wasMastered) data.counters.cardsMastered++;
      addXp(data, ok ? 2 : 0);
      if (ok) okCount++;
      idx++;
      if (idx >= session.length) end();
      else render();
    }
    return wrap;
  }

  function end() {
    touchStreak(data, 'flashcards', session.length);
    const won = checkBadges(data);
    persistProfile();
    view.textContent = '';
    view.append(el('div', { class: 'result-hero' },
      el('b', { text: nf(okCount) }),
      el('span', { text: `${t('carteMaitrisee')} · ${t('score')} : ${nf(Math.round(100 * okCount / session.length))} %` }),
    ));
    for (const b of won) toast(t('newBadge', { b: t(b.key) }));
    view.append(el('button', { class: 'btn gold big', onclick: () => buildFlashcards(root, { data, unitId, cards }) },
      icon('play'), t('recommencer')));
  }

  render();
  return view;
}
return { buildFlashcards, selectDueCards };
});

/* ============================================================

   Leitner et alimentation du carnet d'erreurs.
   ============================================================ */

const { getItem, gradeItem } = __req('assets/js/core/leitner.js');
const { addError, addXp, touchStreak, checkBadges, persistProfile } = __req('assets/js/core/store.js');

const LETTERS = ['A', 'B', 'C', 'D', 'E'];

function isCorrect(q, ans) {
  if (q.type === 'qcm') return ans === q.bonne;
  if (q.type === 'vf') return ans === q.bonne;
  return answerMatches(ans, q.acceptees || [], q.type === 'calcul' ? 0.05 : 0.01);
}

/** Lance un quiz dans `root`. questions : tableau du champ "quiz" d'une unité. */
function buildQuiz(root, { data, unitId, questions }) {
  const state = { idx: 0, correct: 0, answered: false };
  const view = el('section', { class: 'quizview' });
  root.textContent = '';
  root.append(view);

  function renderQuestion() {
    const q = questions[state.idx];
    state.answered = false;
    view.textContent = '';
    const total = questions.length;

    const dots = el('div', { class: 'qdots' });
    questions.forEach((_, i) => {
      const d = el('i');
      if (i < state.idx) d.className = 'done';
      else if (i === state.idx) d.className = 'cur';
      dots.append(d);
    });
    view.append(el('div', { class: 'qbar' },
      el('span', { class: 'n', text: `${nf(state.idx + 1)} / ${nf(total)}` }),
      dots,
    ));

    const qEl = el('div', { class: 'card' });
    qEl.append(el('h3', { text: bi(q.q) }));

    const zone = el('div');
    qEl.append(zone);

    if (q.type === 'qcm') {
      // Ordre d'affichage mélangé : la bonne réponse n'est pas toujours en A
      const order = shuffle(q.choix.map((_, i) => i));
      order.forEach((oi, j) => {
        zone.append(el('button', { class: 'opt', dataset: { k: String(oi) } },
          el('span', { class: 'k', text: LETTERS[j] }), el('bdi', { text: bi(q.choix[oi]) })));
      });
    } else if (q.type === 'vf') {
      for (const [label, val] of [['✔ Vrai / صحيح', true], ['✘ Faux / خطأ', false]]) {
        zone.append(el('button', { class: 'opt', dataset: { k: String(val) } },
          el('span', { class: 'k', text: val ? '✓' : '✗' }), label));
      }
    } else {
      const input = el('input', { type: 'text', inputmode: q.type === 'calcul' ? 'decimal' : 'text',
        placeholder: q.type === 'calcul' ? '123,45' : '…', autocomplete: 'off' });
      zone.append(input);
      zone.append(el('button', { class: 'btn primary', style: 'margin-top:.5rem', text: t('reponse'),
        onclick: () => submit(q.type === 'vf' ? null : input.value, input) }));
    }

    view.append(qEl);
    const feedback = el('div');
    view.append(feedback);
    view.append(nextBtn); // ré-attaché après chaque nettoyage de la vue

    function submit(ans, inputEl) {
      if (state.answered) return;
      state.answered = true;
      const ok = isCorrect(q, ans);
      if (ok) state.correct++;
      const dot = view.querySelector('.qdots i.cur');
      if (dot) dot.classList.add(ok ? 'done' : 'bad');
      // Leitner + carnet
      const ref = `u:${unitId}:${q.id}`;
      gradeItem(getItem(data.srs, ref), ok);
      if (!ok) addError(data, { key: ref, kind: 'quiz', unitId, q: JSON.parse(JSON.stringify(q)) });
      // Marquage visuel
      zone.querySelectorAll('.opt').forEach(btn => {
        btn.disabled = true;
        const k = btn.dataset.k;
        if (k === String(ans) || (q.type === 'vf' && (k === 'true') === !!ans)) btn.classList.add('picked');
        const isBonne = (q.type === 'qcm' && k === String(q.bonne)) ||
                        (q.type === 'vf' && (k === 'true') === !!q.bonne);
        if (isBonne) btn.classList.add('correct');
        if (!ok && k === String(ans) && q.type === 'qcm') btn.classList.add('wrong');
        if (!ok && q.type === 'vf' && k === String(ans) && k !== String(q.bonne)) btn.classList.add('wrong');
      });
      feedback.append(el('div', { class: 'feedback' + (ok ? '' : ' bad') },
        el('strong', { text: ok ? t('bonneReponse') : t('mauvaiseReponse') }),
        q.explication ? el('div', { class: 'why' }, el('bdi', { text: t('explication') + ' : ' + bi(q.explication) })) : null,
      ));
      nextBtn.textContent = state.idx === total - 1 ? t('terminer') : t('suivant');
      nextBtn.disabled = false;
      nextBtn.focus();
    }
    zone.addEventListener('click', e => {
      const btn = e.target.closest('.opt');
      if (!btn || state.answered) return;
      const ans = q.type === 'vf' ? btn.dataset.k === 'true' : Number(btn.dataset.k);
      submit(ans);
    });
    return q;
  }

  const nextBtn = el('button', { class: 'btn primary big', text: t('suivant'), disabled: true });
  nextBtn.addEventListener('click', () => {
    if (!state.answered) return;
    state.idx++;
    if (state.idx >= questions.length) renderEnd();
    else renderQuestion();
  });
  view.append(nextBtn);

  function renderEnd() {
    const total = questions.length;
    const pct = Math.round(100 * state.correct / total);
    const perfect = state.correct === total;
    if (perfect) data.counters.quizPerfect++;
    addXp(data, state.correct * 10 + (perfect ? 5 : 0));
    touchStreak(data, 'quiz', Math.max(3, total));
    const won = checkBadges(data);
    persistProfile();
    view.textContent = '';
    view.append(el('div', { class: 'result-hero' },
      el('b', { text: `${nf(state.correct)} / ${nf(total)}` }),
      el('span', { text: `${t('score')} : ${nf(pct)} %` }),
      el('div', { text: perfect ? t('quizParfait') : t('courage') }),
    ));
    for (const b of won) toast(t('newBadge', { b: t(b.key) }));
    view.append(el('button', { class: 'btn gold big', onclick: () => { state.idx = 0; state.correct = 0; renderQuestion(); } },
      icon('play'), t('recommencer')));
    view.append(el('div', { class: 'note-edit', text: t('carnetIntro') }));
  }

  renderQuestion();
  return view;
}
return { buildQuiz };
});

  setLang(profile.lang || 'fr');

  root.append(appHeader(t('carnet'), { back: { hash: '#/home', label: t('accueil') },

    const counter = el('div', { class: 'qbar' },
      el('span', { class: 'n', text: `${nf(idx + 1)} / ${nf(queue.length)}` }));
    view.append(counter);

    card.append(el('h3', {}, el('bdi', { text: bi(q.q || q.enonce) })));

        el('span', { class: 'k', text: LETTERS[i] }), el('bdi', { text: bi(c) }))));

        entry.streakOk = (entry.streakOk || 0) + 1;
        addXp(data, 5);
        if (entry.streakOk >= 2) { removeError(data, entry.key); }
      } else {
        entry.streakOk = 0;

      persistProfile();
      feedback.append(el('div', { class: 'feedback' + (ok ? '' : ' bad') },
        el('strong', { text: ok ? t('bonneReponse') : t('mauvaiseReponse') }),

      next.focus();

    function submit(ans) {
      const ok = isCorrect(q, ans);

/* ============================================================
   exam.js — Moteur d'examens blancs chronométrés au format
   officiel (Concours 6AF, Brevet 4AS, Bac 7AS) : barème par
   question, réponses auto-corrigées + correction guidée pour les
   questions de rédaction, correction détaillée en fin d'épreuve.

const { addError, addXp, touchStreak, checkBadges, persistProfile } = __req('assets/js/core/store.js');

function flat(exam) {
  const list = [];
  for (const s of exam.sections) {
    for (const q of s.questions) list.push({ sec: s, q });
  }
  return list;
}

function gradeOne(q, ans) {
  if (q.type === 'redaction') return ans || 0; // auto-évaluation (points)
  if (ans == null || ans === '') return 0;
  if (q.type === 'qcm') return ans === q.bonne ? q.points : 0;
  if (q.type === 'vf') return ans === q.bonne ? q.points : 0;
  return answerMatches(ans, q.acceptees || [], q.type === 'calcul' ? 0.05 : 0.01) ? q.points : 0;
}

/** Affiche l'épreuve et renvoie la note obtenue via un callback. */
function runExam(root, { data, exam }) {
  const items = flat(exam);
  const SSKEY = `najma-exam-${exam.id}`;
  const answers = {};
  let cur = 0;
  let remaining = exam.duree_min * 60;
  let submitted = false;
  let timerId = null;

  // Reprise possible après fermeture accidentelle (même session navigateur)
  try {
    const saved = JSON.parse(sessionStorage.getItem(SSKEY) || 'null');
    if (saved && saved.answers) { Object.assign(answers, saved.answers); cur = saved.cur || 0; remaining = saved.remaining ?? remaining; }
  } catch { /* ignore */ }

  const save = () => {
    try { sessionStorage.setItem(SSKEY, JSON.stringify({ answers, cur, remaining })); } catch { /* ignore */ }
  };

  const view = el('section', { class: 'examview' });
  root.textContent = '';
  root.append(view);

  const clock = el('span', { class: 'clock' });
  const bar = progressBar(0);
  const counter = el('span', { class: 'chip', text: '' });
  const timerbar = el('div', { class: 'timerbar' }, clock, bar, counter);
  const qZone = el('div');
  const navZone = el('div', { class: 'row' });

  function fmt(sec) {
    const m = Math.floor(sec / 60), s = sec % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function tick() {
    remaining--;
    clock.textContent = `${t('tempsRestant')} · ${fmt(Math.max(0, remaining))}`;
    bar.firstChild.style.width = `${Math.round(100 * remaining / (exam.duree_min * 60))}%`;
    timerbar.classList.toggle('low', remaining < exam.duree_min * 60 * 0.2);
    if (remaining <= 0) { submit(true); }
    else save();
  }
  timerId = setInterval(tick, 1000);
  clock.textContent = `${t('tempsRestant')} · ${fmt(remaining)}`;

  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

  function render() {
    const it = items[cur];
    const q = it.q;
    counter.textContent = `${nf(cur + 1)} / ${nf(items.length)}`;
    qZone.textContent = '';
    // En-tête de section (barème)
    if (cur === 0 || items[cur - 1].sec !== it.sec) {
      qZone.append(el('div', { class: 'sec-title' },
        el('h3', { text: `${t('secA')} — ${bi(it.sec.titre)}` }),
        el('small', { text: `${nf(it.sec.points)} ${t('points')}` })));
    }
    const card = el('div', { class: 'card examcard' },
      el('div', { class: 'qhead row' },

    const zone = el('div');
    card.append(zone);

    if (q.type === 'qcm') {
      // Ordre mélangé : la bonne réponse change de place à chaque affichage
      const order = shuffle(q.choix.map((_, i) => i));
      order.forEach((oi, j) => {
        zone.append(el('button', { class: 'opt', dataset: { k: String(oi) } },
          el('span', { class: 'k', text: ['A', 'B', 'C', 'D', 'E'][j] }), el('bdi', { text: bi(q.choix[oi]) })));
      });
    } else if (q.type === 'vf') {
      for (const [label, val, k] of [['✔ Vrai / صحيح', true, 'T'], ['✘ Faux / خطأ', false, 'F']]) {
        zone.append(el('button', { class: 'opt', dataset: { k } }, label));
      }
    } else if (q.type === 'redaction') {
      zone.append(el('div', { class: 'def' }, el('bdi', { text: bi(q.consigne || {}) })));
      const corr = el('div', { class: 'sol', hidden: true },
        ...q.correction.etapes.map(s => el('p', {}, el('bdi', { text: '• ' + bi(s) }))),
        q.correction.resultat ? el('p', { html: `<b>${t('resultat')} :</b> <bdi>${bi(q.correction.resultat)}</bdi>` }) : null);
      zone.append(el('button', { class: 'btn ghost', text: t('voirCorrection'), onclick: e => { corr.hidden = false; e.target.remove(); } }), corr);
      const self = el('div', { class: 'selfscore' });
      self.append(el('span', { text: t('autoEvaluation') }));
      for (let p = 0; p <= q.points; p++) {
        self.append(el('button', { class: 'btn', dataset: { p: String(p) }, text: String(p),
          'aria-pressed': String(answers[q.id] === p) }));
      }
      self.addEventListener('click', e => {
        const b = e.target.closest('button[data-p]');

        answers[q.id] = Number(b.dataset.p);
        self.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(Number(x.dataset.p) === answers[q.id])));

      zone.append(input);
    }
    qZone.append(card);

    // Sélection qcm / vf
    zone.addEventListener('click', e => {
      const btn = e.target.closest('.opt');
      if (!btn) return;
      if (q.type === 'qcm') answers[q.id] = Number(btn.dataset.k);
      else answers[q.id] = btn.dataset.k === 'T';
      zone.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', String(x === btn)));
      save();
    });
    zone.querySelectorAll('.opt').forEach(x => {
      const sel = q.type === 'qcm' ? answers[q.id] === Number(x.dataset.k)

      if (answers[q.id] != null && sel) x.setAttribute('aria-pressed', 'true');

    if (cur > 0) navZone.append(el('button', { class: 'btn ghost', text: '← ' + t('precedent'), onclick: () => { cur--; render(); } }));

      navZone.append(el('button', { class: 'btn primary grow', text: t('suivant') + ' →', onclick: () => { cur++; render(); save(); } }));
    } else {
      navZone.append(el('button', { class: 'btn gold grow', text: t('rendre'), onclick: async () => {
        const ok = await modal({ title: t('confirmerRendre'), body: t('donneesLocales'), okLabel: t('rendre'), cancelLabel: t('retour') });

      }

    data.counters.examsDone++;
    addXp(data, 25 + Math.floor(score));
    touchStreak(data, 'examen', Math.min(60, Math.round((exam.duree_min || 60) / 4)));
    const won = checkBadges(data);
    persistProfile();

    // ---- Résultats ----
    const pct = Math.round(100 * score / exam.note_max);
    view.textContent = '';
    view.append(el('div', { class: 'result-hero' },
      el('span', { text: t('noteFinale') }),
      el('b', { text: `${nf(score)} / ${nf(exam.note_max)}` }),
      el('span', { text: `${nf(pct)} %` }),
    ));
    const secList = el('div', { class: 'row', style: 'flex-wrap:wrap;gap:6px' });
    for (const s of exam.sections) {
      secList.append(el('span', { class: 'chip brand', text: `${bi(s.titre)} : ${nf(perSec.get(s) || 0)}/${nf(s.points)}` }));
    }
    view.append(secList);

    view.append(el('h2', { text: t('correctionDetaillee') }));
    for (const it of items) {
      const q = it.q;
      const got = gradeOne(q, answers[q.id]);
      const c = el('div', { class: 'exo' });
      c.append(el('p', {}, el('b', { text: q.id + ' · ' }), el('bdi', { text: bi(q.enonce) })),
        el('p', { class: 'row', style: 'gap:6px' },
          el('span', { class: 'chip ' + (got >= q.points ? 'ok' : got > 0 ? 'warn' : 'err'),
            text: `${nf(got)}/${nf(q.points)} ${t('points')}` }),
          el('span', { class: 'chip', text: `${t('votreRep')} : ${q.type === 'qcm' && answers[q.id] != null ? bi(q.choix[answers[q.id]]) : answers[q.id] == null ? '—' : String(answers[q.id])}` })));
      if (q.type === 'qcm') c.append(el('p', {}, el('bdi', { text: `${t('bonneRep')} : ${bi(q.choix[q.bonne])}` })));
      if (q.type === 'vf') c.append(el('p', {}, el('bdi', { text: `${t('bonneRep')} : ${q.bonne ? '✔' : '✘'}` })));
      if (q.acceptees) c.append(el('p', {}, el('bdi', { text: `${t('bonneRep')} : ${q.acceptees.join(' · ')}` })));

          q.correction.resultat ? el('p', { html: `<b>${t('resultat')} :</b> <bdi>${bi(q.correction.resultat)}</bdi>` }) : null);

    let first = null;
    gate.append(el('p', {}, el('bdi', { text: t('definirPin') })));
    const step1 = pinInput(t('definirPin'), pin => { first = pin; step1.hidden = true; step2.hidden = false; });

      if (hashPin(pin) !== hashPin(first)) {

      }
